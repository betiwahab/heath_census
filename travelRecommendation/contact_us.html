<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Us - Travel Recommendation</title>

    <link rel="stylesheet" href="travel_recommendation.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            <span>✈</span>
            Travel Recommendation
        </div>

        <div class="nav-links">

            <a href="travel_recommendation.html">
                Home
            </a>

            <a href="about_us.html">
                About Us
            </a>

            <a href="contact_us.html">
                Contact Us
            </a>

        </div>

    </nav>


    <!-- ================= CONTACT ================= -->

    <main class="contact-page">

        <section class="contact-section">

            <h1>Contact Us</h1>

            <p>
                We would love to hear from you.
                Please fill out the form below.
            </p>


            <form id="contactForm">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message"
                    required
                ></textarea>


                <button type="submit">
                    Submit
                </button>

            </form>

        </section>

    </main>

</body>
</html>
